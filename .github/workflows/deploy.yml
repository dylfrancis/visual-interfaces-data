name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Start with the portfolio root
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/index.html _site/

      # Build Project 1 into _site/project-1/
      - name: Build Project 1
        working-directory: projects/project-1
        run: |
          npm install
          npm run build
          cp -r dist/ ../../_site/project-1/

      # Copy the static Visualization in the Wild page into _site/vis-in-the-wild/
      - name: Copy Vis in the Wild
        run: |
          mkdir -p _site/vis-in-the-wild
          cp -r projects/vis-in-the-wild/. _site/vis-in-the-wild/
          rm -f _site/vis-in-the-wild/images/README.md

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
