<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Literacy & Internet Usage</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Literacy Rates vs. Internet Usage by Country</h1>
        <p class="byline">By Dylan Francis</p>
        <p class="data-source">
          Data from <a href="https://ourworldindata.org" target="_blank">Our World in Data</a>.
          Most recent available year per country (up to 2023).
        </p>
      </header>

      <div class="dashboard">
        <!-- Top row: histograms + scatterplot -->
        <div class="top-row">
          <section class="chart-section">
            <h2>Distribution of Literacy Rates</h2>
            <div id="histogram-literacy"></div>
          </section>

          <section class="chart-section">
            <h2>Distribution of Internet Usage</h2>
            <div id="histogram-internet"></div>
          </section>

          <section class="chart-section">
            <h2>Literacy Rate vs. Internet Usage</h2>
            <div id="scatterplot"></div>
          </section>
        </div>

        <!-- Bottom row: choropleth maps side-by-side -->
        <div class="bottom-row">
          <section class="chart-section">
            <h2>Literacy Rate by Country</h2>
            <div id="choropleth-literacy"></div>
          </section>

          <section class="chart-section">
            <h2>Internet Usage by Country</h2>
            <div id="choropleth-internet"></div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
