<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Development Dashboard</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Global Development Dashboard</h1>
        <p class="byline">By Dylan Francis</p>
        <p class="data-source">
          Data from <a href="https://ourworldindata.org" target="_blank">Our World in Data</a>.
          Most recent available year per country (up to 2023).
        </p>
      </header>

      <div class="controls">
        <div class="control-group">
          <label for="select-x">X-Axis / Left Map:</label>
          <select id="select-x">
            <option value="literacy" selected>Literacy Rate (%)</option>
            <option value="internet">Internet Usage (%)</option>
            <option value="gdp">GDP per Capita ($)</option>
            <option value="lifeExpectancy">Life Expectancy (years)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="select-y">Y-Axis / Right Map:</label>
          <select id="select-y">
            <option value="literacy">Literacy Rate (%)</option>
            <option value="internet" selected>Internet Usage (%)</option>
            <option value="gdp">GDP per Capita ($)</option>
            <option value="lifeExpectancy">Life Expectancy (years)</option>
          </select>
        </div>
        <div class="control-group">
          <button id="reset-brush">Reset Selection</button>
        </div>
      </div>

      <div class="dashboard">
        <!-- Top row: histograms + scatterplot -->
        <div class="top-row">
          <section class="chart-section">
            <h2 id="title-hist-x">Distribution of Literacy Rate</h2>
            <div id="histogram-x"></div>
          </section>

          <section class="chart-section">
            <h2 id="title-hist-y">Distribution of Internet Usage</h2>
            <div id="histogram-y"></div>
          </section>

          <section class="chart-section">
            <h2 id="title-scatter">Literacy Rate vs. Internet Usage</h2>
            <div id="scatterplot"></div>
          </section>
        </div>

        <!-- Bottom row: choropleth maps side-by-side -->
        <div class="bottom-row">
          <section class="chart-section">
            <h2 id="title-map-x">Literacy Rate by Country</h2>
            <div id="choropleth-x"></div>
          </section>

          <section class="chart-section">
            <h2 id="title-map-y">Internet Usage by Country</h2>
            <div id="choropleth-y"></div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
